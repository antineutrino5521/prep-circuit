<!DOCTYPE html>
<html>

<head>

<title>Physics PYQs</title>

<style>

body{
background:#070b16;
color:white;
font-family:Arial;
padding:40px;
}

.question-box{
max-width:800px;
margin:auto;
background:#111827;
padding:30px;
border-radius:20px;
}

.option{
display:block;
margin-top:15px;
padding:14px;
background:#1f2937;
border-radius:10px;
cursor:pointer;
}

.option:hover{
background:#374151;
}

button{
margin-top:25px;
padding:14px 24px;
border:none;
border-radius:10px;
background:#6c63ff;
color:white;
cursor:pointer;
}

</style>

</head>

<body>

<div class="question-box">

<h2>
Q1. SI unit of Force is?
</h2>

<label class="option">
<input type="radio" name="q1">
Newton
</label>

<label class="option">
<input type="radio" name="q1">
Joule
</label>

<label class="option">
<input type="radio" name="q1">
Pascal
</label>

<label class="option">
<input type="radio" name="q1">
Watt
</label>

<button onclick="nextQuestion()">
Next Question
</button>

</div>

<script>

function nextQuestion(){

alert("Next Question Coming Soon");

}

</script>

</body>

</html>
