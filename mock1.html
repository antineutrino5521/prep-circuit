<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>JEE Main Mock Test</title>

<style>

body{
background:#070b16;
color:white;
font-family:Arial;
padding:30px;
}

.quiz-box{
max-width:900px;
margin:auto;
background:#111827;
padding:30px;
border-radius:20px;
}

.top{
display:flex;
justify-content:space-between;
margin-bottom:25px;
}

.question{
font-size:24px;
margin-bottom:20px;
}

.option{
background:#1f2937;
padding:15px;
margin:12px 0;
border-radius:10px;
cursor:pointer;
transition:0.3s;
}

.option:hover{
background:#374151;
}

button{
padding:14px 24px;
margin-top:20px;
border:none;
border-radius:10px;
background:#6c63ff;
color:white;
font-size:16px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="quiz-box">

<div class="top">

<h2>
JEE Main Mock Test
</h2>

<h2 id="timer">
90:00
</h2>

</div>

<div class="question" id="question">
Loading...
</div>

<div id="options"></div>

<button onclick="nextQuestion()">
Next Question
</button>

</div>

<script>

let quizData = [];
let current = 0;
let score = 0;

fetch("2S1.json")

.then(response => response.json())

.then(data => {

quizData = data;

loadQuestion();

});

function loadQuestion(){

document.getElementById("question").innerHTML =
quizData[current].question;

let html = "";

quizData[current].options.forEach(option => {

html += `
<div class="option"
onclick="checkAnswer('${option}')">
${option}
</div>
`;

});

document.getElementById("options").innerHTML =
html;

}

function checkAnswer(selected){

if(selected == quizData[current].answer){

score++;

alert("Correct");

}
else{

alert("Wrong");

}

}

function nextQuestion(){

current++;

if(current >= quizData.length){

document.querySelector(".quiz-box").innerHTML =
`
<h1>
Mock Test Finished
</h1>

<h2>
Your Score:
${score}/${quizData.length}
</h2>
`;

return;

}

loadQuestion();

}

let time = 5400;

setInterval(()=>{

let minutes = Math.floor(time/60);

let seconds = time%60;

document.getElementById("timer").innerHTML =
`${minutes}:${seconds<10?"0":""}${seconds}`;

time--;

},1000);

</script>

</body>
</html>
