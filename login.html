<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  GoogleAuthProvider,
  signInWithPopup
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyC5cSxB7Pzy9g7ayRYYCXrhjUaJ2x8dKCI",
  authDomain: "prep-circuit.firebaseapp.com",
  projectId: "prep-circuit",
  storageBucket: "prep-circuit.firebasestorage.app",
  messagingSenderId: "534599124342",
  appId: "1:534599124342:web:57de366cf8422a76cfa657"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// SIGN UP
window.signup = function(e){
  if(e) e.preventDefault();

  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  createUserWithEmailAndPassword(auth, email, password)
  .then(() => {
    localStorage.setItem("studentName", name);
    window.location.href = "dashboard.html";
  })
  .catch(err => alert(err.message));
};

// LOGIN
window.login = function(e){
  if(e) e.preventDefault();

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  signInWithEmailAndPassword(auth, email, password)
  .then(() => {
    window.location.href = "dashboard.html";
  })
  .catch(err => alert(err.message));
};

// GOOGLE LOGIN
window.googleLogin = function(){

  const provider = new GoogleAuthProvider();

  signInWithPopup(auth, provider)
  .then(result => {
    localStorage.setItem("studentName", result.user.displayName);
    window.location.href = "dashboard.html";
  })
  .catch(err => alert(err.message));
};

</script>
