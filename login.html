<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  GoogleAuthProvider,
  signInWithPopup
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyC5cSxB7Pzy9g7ayRYYCXrhjUaJ2x8dKCI",
  authDomain: "prep-circuit.firebaseapp.com",
  projectId: "prep-circuit",
  storageBucket: "prep-circuit.firebasestorage.app",
  messagingSenderId: "534599124342",
  appId: "1:534599124342:web:57de366cf8422a76cfa657"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// SAFE DEBUG
console.log("Login page loaded");

window.signup = async function () {
  try {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    await createUserWithEmailAndPassword(auth, email, password);

    window.location.href = "dashboard.html";
  } catch (e) {
    alert(e.message);
  }
};

window.login = async function () {
  try {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    await signInWithEmailAndPassword(auth, email, password);

    window.location.href = "dashboard.html";
  } catch (e) {
    alert(e.message);
  }
};

window.googleLogin = async function () {
  try {
    const provider = new GoogleAuthProvider();
    const result = await signInWithPopup(auth, provider);

    localStorage.setItem("studentName", result.user.displayName);

    window.location.href = "dashboard.html";
  } catch (e) {
    alert(e.message);
  }
};

</script>
