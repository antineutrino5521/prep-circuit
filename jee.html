<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JEE Practice - Prep Circuit</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#070b16;
color:white;
padding:40px 5%;
}

h1{
text-align:center;
margin-bottom:10px;
font-size:40px;
color:#7b8cff;
}

.subtitle{
text-align:center;
color:#bdbdbd;
margin-bottom:50px;
}

.container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:30px;
}

.card{
background:#111827;
padding:35px;
border-radius:20px;
text-align:center;
transition:0.3s;
border:1px solid rgba(255,255,255,0.08);
}

.card:hover{
transform:translateY(-8px);
box-shadow:0 0 25px rgba(108,99,255,0.3);
}

.icon{
font-size:55px;
margin-bottom:20px;
color:#7b8cff;
}

.card h2{
margin-bottom:15px;
}

.card p{
color:#c7c7c7;
margin-bottom:25px;
line-height:1.6;
}

button{
padding:14px 24px;
border:none;
border-radius:12px;
background:linear-gradient(135deg,#6c63ff,#00bfff);
color:white;
font-size:15px;
cursor:pointer;
}

button:hover{
opacity:0.9;
}

</style>

</head>

<body>

<h1>JEE Practice</h1>

<p class="subtitle">
Practice chapter-wise JEE Main PYQs
</p>

<div class="container">

<!-- Physics -->

<div class="card">

<div class="icon">
<i class="fa-solid fa-atom"></i>
</div>

<h2>Physics</h2>

<p>
Practice Mechanics, Modern Physics, Current Electricity and more.
</p>

<a href="physics.html">
<button>
Start Physics
</button>
</a>

</div>

<!-- Chemistry -->

<div class="card">

<div class="icon">
<i class="fa-solid fa-flask"></i>
</div>

<h2>Chemistry</h2>

<p>
Solve Organic, Inorganic and Physical Chemistry PYQs easily.
</p>

<a href="chemistry.html">
<button>
Start Chemistry
</button>
</a>

</div>

<!-- Maths -->

<div class="card">

<div class="icon">
<i class="fa-solid fa-square-root-variable"></i>
</div>

<h2>Mathematics</h2>

<p>
Improve speed and accuracy with JEE Maths practice questions.
</p>

<a href="maths.html">
<button>
Start Maths
</button>
</a>

</div>

</div>

</body>

</html>
